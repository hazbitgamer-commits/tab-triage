<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Triage</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <h1>Tab Triage</h1>
    <span id="total" class="total"></span>
  </header>

  <div id="undo-bar" class="undo-bar" hidden>
    <span id="undo-text"></span>
    <button id="btn-undo" class="btn">Undo</button>
  </div>

  <details class="bucket" id="bucket-keep" open>
    <summary title="Used in the last 2 hours, pinned, or playing audio">
      <span class="chev"></span><span class="dot keep"></span>
      <span class="name">KEEP</span><span class="count" id="count-keep">0</span>
    </summary>
    <ul class="list" id="list-keep"></ul>
  </details>

  <details class="bucket" id="bucket-stash" open>
    <summary title="Untouched for 2+ hours">
      <span class="chev"></span><span class="dot stash"></span>
      <span class="name">STASH</span><span class="count" id="count-stash">0</span>
      <button id="btn-close-stash" class="btn">Close all STASH</button>
    </summary>
    <ul class="list" id="list-stash"></ul>
  </details>

  <details class="bucket" id="bucket-dump" open>
    <summary title="Untouched for 24+ hours, or a duplicate of another tab">
      <span class="chev"></span><span class="dot dump"></span>
      <span class="name">DUMP</span><span class="count" id="count-dump">0</span>
      <button id="btn-close-dump" class="btn danger">Close all DUMP</button>
    </summary>
    <ul class="list" id="list-dump"></ul>
  </details>

  <section class="saved">
    <div class="saved-header" title="Everything Tab Triage closes lands here first. Click an entry to bring it back.">
      <span class="name">SAVED</span><span class="count" id="count-saved">0</span>
      <button id="btn-restore-all" class="btn">Restore all</button>
      <button id="btn-clear-saved" class="btn quiet">Clear</button>
    </div>
    <ul class="list" id="list-saved"></ul>
  </section>

  <script src="triage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
